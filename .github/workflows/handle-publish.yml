name: Handle plugin publish

on:
  repository_dispatch:
    types: [plugin_publish]

jobs:
  validate-and-register:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Extract payload
        id: payload
        run: |
          echo "plugin_id=${{ github.event.client_payload.plugin_id }}" >> $GITHUB_OUTPUT
          echo "version=${{ github.event.client_payload.version }}"     >> $GITHUB_OUTPUT
          echo "repo=${{ github.event.client_payload.repo }}"           >> $GITHUB_OUTPUT

      - name: Resolve release assets and manifest
        id: release
        env:
          PLUGIN_REPO: ${{ steps.payload.outputs.repo }}
          VERSION: ${{ steps.payload.outputs.version }}
        run: |
          REPO_PATH="${PLUGIN_REPO#https://github.com/}"

          RELEASE=$(curl -sf \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO_PATH}/releases/tags/${VERSION}")

          if [ -z "$RELEASE" ]; then
            echo "Release ${VERSION} not found in ${REPO_PATH}"
            exit 1
          fi

          # Download prunesh.json from release assets
          MANIFEST_URL=$(echo "$RELEASE" | jq -r '.assets[] | select(.name == "prunesh.json") | .browser_download_url')
          if [ -z "$MANIFEST_URL" ]; then
            echo "prunesh.json not found in release assets for ${VERSION}"
            exit 1
          fi
          curl -sL "$MANIFEST_URL" -o /tmp/prunesh.json

          # Build binary_urls map: match each platform in prunesh.json to a release asset
          python3 - <<'EOF'
          import json, re, sys

          with open('/tmp/prunesh.json') as f:
            manifest = json.load(f)

          release = json.loads("""$RELEASE""")
          assets = {a['name']: a['browser_download_url'] for a in release.get('assets', [])}

          binary_urls = {}
          for platform in manifest.get('platforms', []):
            os_name, arch = platform.split('/')
            matched = None
            for name, url in assets.items():
              if re.search(rf'{os_name}[._-]{arch}|{arch}[._-]{os_name}', name, re.IGNORECASE):
                matched = url
                break
            if matched:
              binary_urls[platform] = matched
            else:
              print(f"WARNING: no binary asset found for platform {platform}", file=sys.stderr)

          with open('/tmp/binary_urls.json', 'w') as f:
            json.dump(binary_urls, f)

          print(f"Resolved {len(binary_urls)}/{len(manifest.get('platforms', []))} platform binaries")
          EOF

          # Download the linux/amd64 binary for the contract probe
          PROBE_URL=$(python3 -c "
          import json
          d = json.load(open('/tmp/binary_urls.json'))
          print(d.get('linux/amd64', ''))
          ")
          if [ -z "$PROBE_URL" ]; then
            echo "No linux/amd64 binary found — cannot run contract probe"
            exit 1
          fi
          echo "probe_url=$PROBE_URL" >> $GITHUB_OUTPUT

      - name: Run contract probe
        run: |
          curl -sL "${{ steps.release.outputs.probe_url }}" -o /tmp/plugin-bin
          chmod +x /tmp/plugin-bin

          REWRITE=$(echo '{"operation":"rewrite","args":["test"],"output":"","exit_code":-1}' \
            | timeout 5 /tmp/plugin-bin)
          echo "$REWRITE" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          assert 'args' in d and 'changed' in d, f'rewrite probe: unexpected response: {d}'
          " || { echo "Contract probe failed: rewrite"; exit 1; }

          FILTER=$(echo '{"operation":"filter_output","args":["test"],"output":"sample output","exit_code":0}' \
            | timeout 5 /tmp/plugin-bin)
          echo "$FILTER" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          assert 'output' in d and 'changed' in d, f'filter_output probe: unexpected response: {d}'
          " || { echo "Contract probe failed: filter_output"; exit 1; }

          echo "Contract probe passed"

      - name: Register plugin
        id: register
        env:
          PLUGIN_ID: ${{ steps.payload.outputs.plugin_id }}
          VERSION: ${{ steps.payload.outputs.version }}
          REPO: ${{ steps.payload.outputs.repo }}
        run: |
          SLUG=$(echo "$PLUGIN_ID" | tr '/' '-')
          YAML_PATH="plugins/${SLUG}.yaml"
          AUTHOR=$(echo "$PLUGIN_ID" | cut -d'/' -f1)
          COMMAND=$(echo "$PLUGIN_ID" | cut -d'/' -f2)
          VERSION_DIR="site/modules/${AUTHOR}/${COMMAND}"
          VERSION_FILE="${VERSION_DIR}/${VERSION}.json"
          INDEX_FILE="${VERSION_DIR}/index.json"

          if [ -f "$VERSION_FILE" ]; then
            echo "Version ${VERSION} already published for ${PLUGIN_ID} — skipping"
            echo "skipped=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Create plugin YAML pointer on first publish
          if [ ! -f "$YAML_PATH" ]; then
            mkdir -p plugins
            cat > "$YAML_PATH" <<YAML
          id: ${PLUGIN_ID}
          command: ${COMMAND}
          repo: ${REPO}
          YAML
          fi

          # Write immutable version file including manifest fields and per-platform binary URLs
          mkdir -p "$VERSION_DIR"
          python3 - <<EOF
          import json
          from datetime import datetime, timezone

          manifest = json.load(open('/tmp/prunesh.json'))
          binary_urls = json.load(open('/tmp/binary_urls.json'))

          version_file = {
            "id": "${PLUGIN_ID}",
            "command": manifest.get("command", "${COMMAND}"),
            "version": "${VERSION}",
            "repo": "${REPO}",
            "binary_urls": binary_urls,
            "platforms": manifest.get("platforms", []),
            "contract": manifest.get("contract", "stdin/v1"),
            "prunesh_core_version": manifest.get("prunesh-core-version", {}),
            "published_at": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
          }

          with open("${VERSION_FILE}", "w") as f:
            json.dump(version_file, f, indent=2)

          print(f"Written ${VERSION_FILE}")
          EOF

          # Update index (latest pointer)
          cat > "$INDEX_FILE" <<JSON
          {
            "id": "${PLUGIN_ID}",
            "latest": "${VERSION}",
            "repo": "${REPO}"
          }
          JSON

          echo "skipped=false" >> $GITHUB_OUTPUT

      - name: Commit and push
        if: steps.register.outputs.skipped != 'true'
        env:
          PLUGIN_ID: ${{ steps.payload.outputs.plugin_id }}
          VERSION: ${{ steps.payload.outputs.version }}
        run: |
          git config user.name "prunesh-marketplace-bot[bot]"
          git config user.email "prunesh-marketplace-bot[bot]@users.noreply.github.com"
          git add plugins/ site/modules/
          git commit -m "publish: ${PLUGIN_ID}@${VERSION}"
          git push
